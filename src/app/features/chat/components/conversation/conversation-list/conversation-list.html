<div class="h-full flex flex-col space-y-1 md:space-y-1.5 lg:space-y-2">
  <!--#region New Conversation Button -->
  <div class="p-1.5 md:p-2 lg:p-2.5">
    <button
      class="w-full py-1 md:py-1.5 lg:py-2 px-2 md:px-2.5 lg:px-3 bg-gradient-to-r from-blue-500 to-purple-600 rounded-lg text-white font-medium text-sm md:text-base lg:text-lg hover:from-blue-600 hover:to-purple-700 transition-all duration-200 flex items-center gap-1 md:gap-1.5 lg:gap-2 shadow-lg shadow-blue-900/20 cursor-pointer"
      (click)="createNewSession.emit()"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 md:h-4 md:w-4 lg:h-5 lg:w-5" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
      </svg>
      New Chat
    </button>
  </div>
  <!--#endregion New Conversation Button -->

  <!--#region Conversation List -->
  <div class="flex-1 overflow-y-auto py-1 md:py-1.5 lg:py-2 px-1.5 md:px-2 lg:px-2.5 space-y-1 md:space-y-1.5 lg:space-y-2">
    @for (conversation of conversations(); track conversation.id) {
      <nexus-conversation-card
        [session]="conversation"
        [activeSessionId]="activeSessionId()"
        (setActiveSession)="setActiveSession.emit($event)"
        (deleteSession)="deleteSession.emit($event)"
      />
    }
  </div>
  <!--#endregion Conversation List -->
</div>
