<div class="message-container">
  <div
    class="rounded-2xl p-6 mb-0.5 md:mb-2 bg-gray-800 text-gray-100 rounded-tl-sm"
  >
    <!--#region Avatar and Name -->
    <div class="flex items-center mb-2">
      <div
        class="w-8 h-8 md:w-10 md:h-10 lg:w-12 lg:h-12 rounded-full flex items-center justify-center mr-2 md:mr-3 bg-purple-700"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5 md:h-6 md:w-6 lg:h-7 lg:w-7 text-white"
          viewBox="0 0 20 20"
          fill="currentColor"
        >
          <path d="M2 10a8 8 0 018-8v8h8a8 8 0 11-16 0z" />
          <path d="M12 2.252A8.014 8.014 0 0117.748 8H12V2.252z" />
        </svg>
      </div>
      <div>
        <div class="font-medium text-sm md:text-base lg:text-lg">
          {{ isUser ? 'You' : 'NexusChat' }}
        </div>
        <div class="text-xs opacity-70">{{ formattedTime }}</div>
      </div>
    </div>
    <!--#endregion Avatar and Name -->

    <!--#region Message Content -->
    <markdown
      emoji
      katex
      mermaid
      clipboard
      lineNumbers
      lineHighlight
      commandLine
      class="markdown-body whitespace-break-spaces"
      [data]="message().content"
    />
    <!--#endregion Message Content -->
  </div>
</div>
