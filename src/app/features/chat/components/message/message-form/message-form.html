<form (ngSubmit)="onSubmit()" class="relative">
  <div class="relative flex items-center">
    <input 
      #messageInput
      type="text" 
      [ngModel]="$message()"
      (ngModelChange)="onMessageChange($event)"
      name="message"
      placeholder="Send a message..."
      class="w-full py-1.5 md:py-2 lg:py-2.5 px-2 md:px-2.5 lg:px-3 bg-gray-800 border border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-white placeholder-gray-400 text-sm md:text-base lg:text-lg"
      [disabled]="$isSubmitting()"
      autocomplete="off"
    />

    <button 
      type="submit" 
      class="absolute right-1 md:right-1.5 lg:right-2 p-1 md:p-1.5 lg:p-2 rounded-lg text-blue-400 hover:text-blue-300 hover:bg-gray-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer"
      [disabled]="!$message().trim() || $isSubmitting()"
    >
      <svg 
        xmlns="http://www.w3.org/2000/svg" 
        class="h-4 w-4 md:h-5 md:w-5 lg:h-6 lg:w-6" 
        fill="none" 
        viewBox="0 0 24 24" 
        stroke="currentColor"
        [class.animate-pulse]="$isSubmitting()"
      >
        <path 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          stroke-width="2" 
          d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" 
        />
      </svg>
    </button>
  </div>

  <p class="text-xs text-gray-500 mt-1 text-center">
    NexusChat may produce inaccurate information about people, places, or facts.
  </p>
</form>
