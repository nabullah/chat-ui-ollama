<div class="h-full flex-1 flex flex-col">
  <div class="h-7 md:h-8 lg:h-10 border-b border-gray-700 flex items-center px-3 justify-between">
    <h2 class="text-sm md:text-base lg:text-lg font-medium">
      {{ title() }}
    </h2>
    <div class="flex items-center">
      <input 
        type="checkbox" 
        id="withContext" 
        [checked]="withContext()"
        (change)="onContextChange($event)"
        class="h-4 w-4 text-blue-600 rounded focus:ring-blue-500"
      />
      <label for="withContext" class="ml-2 text-xs md:text-sm">
        With Context
      </label>
    </div>
  </div>
  
  <div class="flex-1 overflow-hidden flex flex-col">
    <ng-content />
  </div>
</div>
